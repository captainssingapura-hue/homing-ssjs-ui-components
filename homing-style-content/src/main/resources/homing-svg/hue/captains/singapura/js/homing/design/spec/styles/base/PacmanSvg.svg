    <path d="M 9 12 L 15.55 7.41 A 8 8 0 1 0 15.55 16.59 Z" style="fill: var(--fp-accent); stroke: none"/>
    <circle cx="9.4" cy="7.4" r="1.2"/>
    <circle cx="18.6" cy="12" r="1.4" style="fill: var(--fp-danger-ink); stroke: none"/>
    <circle cx="22.2" cy="12" r="1.4" style="fill: var(--fp-danger-ink); stroke: none"/>
</svg>
